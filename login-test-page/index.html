<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="login-container" id="loginView">
    <form class="login-card" id="loginForm" novalidate>
      <h1 class="login-title">Sign in</h1>
      <p class="login-subtitle">Welcome back. Please enter your details.</p>

      <div class="field">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
        <span class="error-message" id="emailError" aria-live="polite"></span>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        />
        <span class="error-message" id="passwordError" aria-live="polite"></span>
      </div>

      <button type="submit" class="btn-primary">Sign in</button>

      <p class="login-footer">
        Don't have an account? <a href="#">Create one</a>
      </p>
    </form>
  </main>

  <section class="success-container hidden" id="successView" aria-hidden="true">
    <div class="success-card">
      <div class="success-icon">&#10003;</div>
      <h1 class="success-title">Logged in</h1>
      <p class="success-subtitle" id="successEmail"></p>
      <button type="button" class="btn-secondary" id="logoutBtn">Log out</button>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
